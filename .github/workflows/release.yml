name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Validate release metadata
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Release workflow must run from a vX.Y.Z tag, got {tag!r}")

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"Release tag {tag!r} does not match pyproject version {version!r}"
              )

          changelog = Path("CHANGELOG.md").read_text()
          if f"## {version}" not in changelog:
              raise SystemExit(f"CHANGELOG.md is missing a ## {version} section")
          PY
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build distributions
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - name: Extract changelog section
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          lines = Path("CHANGELOG.md").read_text().splitlines()
          heading = f"## {version}"

          try:
              start = lines.index(heading)
          except ValueError as err:
              raise SystemExit(f"CHANGELOG.md is missing a {heading} section") from err

          end = len(lines)
          for index in range(start + 1, len(lines)):
              if lines[index].startswith("## "):
                  end = index
                  break

          body = "\n".join(lines[start:end]).strip()
          if not body:
              raise SystemExit(f"CHANGELOG.md section {heading} is empty")
          Path("release-notes.md").write_text(f"{body}\n")
          PY
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
